name: Publish to MCP Registry

# Publishes the Oppi Digital Products MCP server to the Official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC — no npm package needed:
# the distribution artifact is an MCPB (.mcpb) hosted in a GitHub release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/v1.8.1" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          set -euo pipefail
          version="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          name="$(python3 -c "import json;print(json.load(open('server.json'))['name'])")"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=Reggiebro" \
             | grep -q "\"name\":\"${name}\",\"description\"" \
             && curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=Reggiebro" \
             | grep -q "\"version\":\"${version}\""; then
            echo "Version ${version} of ${name} already published — skipping duplicate publish."
            exit 0
          fi
          ./mcp-publisher publish
